<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact A Fitness Diary for any inquiries, feedback, or support. Reach out via email or our contact form.">
    <meta name="keywords" content="Contact Fitness Diary, Fitness Support, Get in Touch">
    <meta name="author" content="A Fitness Diary">
    <meta name="robots" content="index, follow">

    <!-- Open Graph (OG) Meta Tags for Facebook -->
    <meta property="og:title" content="Fitness Diary - Your Guide to a Healthier Life">
    <meta property="og:description" content="Contact A Fitness Diary for any inquiries, feedback, or support. Reach out via email or our contact form.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://fitnessdiary.github.io/contact.html">
    <meta property="og:image" content="https://fitnessdiary.github.io/fitnessdiary.png">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Disclaimer - Fitness Diary">
    <meta name="twitter:description" content="Contact A Fitness Diary for any inquiries, feedback, or support. Reach out via email or our contact form.">
    <meta name="twitter:image" content="https://fitnessdiary.github.io/afitnessdiary.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://fitnessdiary.github.io/fitnessdiary.png">
    <link rel="canonical" href="https://fitnessdiary.github.io/">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="pro-style.css" rel="stylesheet">
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    
    <title>Contact Us - A Fitness Diary</title>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "ContactPage",
        "name": "Contact Us - A Fitness Diary",
        "description": "Contact A Fitness Diary for any inquiries, feedback, or support.",
        "url": "https://fitnessdiary.github.io/contact",
        "email": "mailto:thefitnessdiaryus@gmail.com",
        "sameAs": [
            "https://facebook.com/fitnessdiaryus"
        ]
    }
    </script>
  </head>
	<body>
		<!-- Navbar Section Start-->
        <div class="bg-light nav-bg sticky-top" id="navbar-container"></div>
		<!-- Navbar Section End-->

		<div class="container wrap">
			<div class="row">
				<article class="col-sm-8 single-post">
					<div class="post-body">
						<h1 class="bd-title" id="content">Contact Us</h1>
						<div class="post-body">
							<div class="text-justify postimg">
                <p>If you have any questions, suggestions, or concerns, feel free to contact us using the form below or email us at <a href="mailto:thefitnessdiaryus@gmail.com">thefitnessdiaryus@gmail.com</a>.</p>

                <div class="contact-form">
                    <form action="mailto:thefitnessdiaryus@gmail.com" method="post" enctype="text/plain">
                        <div class="mb-3">
                            <label for="name" class="form-label">Your Name</label>
                            <input type="text" id="name" name="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Your Email</label>
                            <input type="email" id="email" name="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Your Message</label>
                            <textarea id="message" name="message" class="form-control" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Send Message</button>
                    </form>
                </div>
							</div>
						</div>
					</div>
				</article>
				<aside id="sidebar-container-page" class="bd-sidebar col-sm-4 text-center"></aside>
			</div>
		</div>
        <!-- Footer Section-->
		<footer class="footer" id="footer-container">
		</footer>
		<!-- End of Footer Section -->
		<script>
			// Function to load navbar and footer
			document.addEventListener("DOMContentLoaded", function () {
				fetch("navbar.html")
					.then(response => response.text())
					.then(data => {
						document.getElementById("navbar-container").innerHTML = data;
					})
					.catch(error => console.error("Error loading the navbar:", error));
				
				fetch("page-navbar.html")
					.then(response => response.text())
					.then(data => {
						document.getElementById("navbar-container-page").innerHTML = data;
					})
					.catch(error => console.error("Error loading the navbar:", error));
				
				fetch("related-post.html")
					.then(response => response.text())
					.then(data => {
						document.getElementById("relatedpost-container-page").innerHTML = data;
					})
					.catch(error => console.error("Error loading the navbar:", error));

				
				fetch("sidebar.html")
					.then(response => response.text())
					.then(data => {
						document.getElementById("sidebar-container-page").innerHTML = data;
					})
					.catch(error => console.error("Error loading the navbar:", error));

				fetch("footer.html")
					.then(response => response.text())
					.then(data => {
						document.getElementById("footer-container").innerHTML = data;
					})
					.catch(error => console.error("Error loading the footer:", error));
			});
		</script>
<!-- Scroll to Top Button -->
<button onclick="topFunction()" id="scrollToTopBtn" title="Go to top">Top</button>

<!-- Chatbot Button -->
<button id="chatbotBtn" style="display:none;" onclick="openChatbot()">💬</button>

<!-- JavaScript -->
<script src="myscripts.js"></script>
</body>
</html>
